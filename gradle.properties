pluginGroup   = io.github.lemyst
pluginName    = enforce-script-intellij
pluginVersion = 0.2.0

# The OLDEST supported IDE: the build compiles and tests against it. Must agree with `sinceBuild`.
platformVersion = 2025.2.6.4
# The newest release, used only by `runIdeLatest` for manual testing on a current IDE.
latestPlatformVersion = 2026.2.4

# Corpus test roots are machine-specific, so they are deliberately NOT set here. Put them in your
# user-level ~/.gradle/gradle.properties (which overrides this file), or pass them with -P. Every
# corpus test skips rather than fails when its property is unset or the path is absent.
#
#   enfusionCorpusRoot  - the vanilla DayZ script tree, e.g. P:\\scripts
#   enfusionLayoutRoots - roots holding .layout / .imageset files, `;`-separated. Include a mod
#                         checkout alongside P:\\gui: vanilla layouts carry no comments at all, so
#                         without hand-written ones the comment rules go untested.
#   enfusionConfigRoots - roots holding config.cpp / mod.cpp, `;`-separated. Use several trees:
#                         hand-written mod configs, a large third-party mod (Expansion has ~349),
#                         and P:\\DZ, whose 207 de-rapified vanilla configs are machine-generated and
#                         differ in shape (scientific notation, no comments, no `+=`).
#   enfusionTextureRoots - roots holding .edds / .paa textures, `;`-separated: P:\\gui, P:\\DZ and
#                         a mod or two. Each root is sampled down to enfusionCorpusLimit (2,000).
#   enfusionPboRoots     - folders holding packed .pbo files, `;`-separated: a DayZ install's addons
#                          folder and some Workshop @Mod folders. Never commit PBOs themselves.
#   enfusionCorpusLimit - optional; samples N files instead of walking the whole corpus.

# The platform ships its own Kotlin stdlib; bundling a second one causes classloader grief.
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.caching = true
org.gradle.configuration-cache = false
