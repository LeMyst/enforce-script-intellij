# The declarative inlay-hint settings read their names and descriptions from a bundle.
inlay.auto.types.name=Types of auto variables
inlay.auto.types.description=The type inferred for an <code>auto</code> local or <code>foreach</code> variable, shown after its name: <code>auto p: Param1&lt;int&gt;</code>.
inlay.parameter.names.name=Parameter names
inlay.parameter.names.description=The parameter's name before a number, boolean, <code>null</code> or string argument of a call, when every overload the call may mean names it the same: <code>CallLater(Refresh, delay: 1000, repeat: false)</code>. Printing, maths and container calls are left out.
